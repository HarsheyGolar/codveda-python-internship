{% extends "base.html" %}

{% block title %}Checkout — DjangoCart{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Checkout</h1>
    <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
        <div class="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-credit-card text-indigo-600 text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-900">Checkout is not available yet</h2>
        <p class="text-gray-500 text-sm mt-2">Your cart and payment flow will appear here once order processing is enabled.</p>
        <a href="{% url 'product_list' %}" class="inline-flex items-center mt-6 bg-indigo-600 text-white px-6 py-3 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
            Continue shopping
        </a>
    </div>
</div>
{% endblock %}
