{% extends "base.html" %}

{% block title %}Order Confirmed — DjangoCart{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-2xl shadow-sm p-12 text-center">
        <div class="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check-circle text-green-500 text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Thank you</h1>
        <p class="text-gray-500 mb-8">Order confirmation will appear here when checkout is connected.</p>
        <a href="{% url 'home' %}" class="inline-flex items-center bg-indigo-600 text-white px-6 py-3 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
            Back to home
        </a>
    </div>
</div>
{% endblock %}
